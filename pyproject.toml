[project]
name = "sqlassay"
version = "0.1.0"
description = "Execution-verified text-to-SQL for local models: three deterministic gates, retrieval ablations, and controls that must be able to go red."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "sqlglot>=27",
    "sqlite-vec>=0.1.9",
    "pydantic>=2",
    "typer",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
sqlassay = "sqlassay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlassay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs a running Ollama with the configured models; deselect with -m 'not model'",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["sqlassay"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*", "sqlite_vec.*", "duckdb.*"]
ignore_missing_imports = true
